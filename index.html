<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <input type="text" id="display" disabled />

      <div class="button-container">
        <button
          type="button"
          class="button clear"
          onclick="
            currentDisplay = '';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          C
        </button>
        <button
          type="button"
          class="button"
          onclick="
            currentDisplay += '7';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          7
        </button>
        <button
          type="button"
          class="button"
          onclick="
            currentDisplay += '8';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          8
        </button>
        <button
          type="button"
          class="button"
          onclick="
            currentDisplay += '9';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          9
        </button>

        <button
          type="button"
          class="button operator"
          onclick="
            currentDisplay += '/';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          /
        </button>

        <button
          type="button"
          class="button"
          onclick="
            currentDisplay += '4';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          4
        </button>
        <button
          type="button"
          class="button"
          onclick="
            currentDisplay += '5';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          5
        </button>
        <button
          type="button"
          class="button"
          onclick="
            currentDisplay += '6';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          6
        </button>

        <button
          type="button"
          class="button operator"
          onclick="
            currentDisplay += '*';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          *
        </button>

        <button
          type="button"
          class="button"
          onclick="
            currentDisplay += '1';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          1
        </button>
        <button
          type="button"
          class="button"
          onclick="
            currentDisplay += '2';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          2
        </button>
        <button
          type="button"
          class="button"
          onclick="
            currentDisplay += '3';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          3
        </button>

        <button
          type="button"
          class="button operator"
          onclick="
            currentDisplay += '-';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          -
        </button>

        <button
          type="button"
          class="button zero"
          onclick="
            currentDisplay += '0';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          0
        </button>
        <button
          type="button"
          class="button"
          onclick="
            currentDisplay += '.';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          .
        </button>

        <button
          type="button"
          class="button equal"
          onclick="
            currentDisplay = eval(currentDisplay);
            document.querySelector('#display').value = currentDisplay;
          "
        >
          =
        </button>

        <button
          type="button"
          class="button operator"
          onclick="
            currentDisplay += '+';
            document.querySelector('#display').value = currentDisplay;
          "
        >
          +
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
